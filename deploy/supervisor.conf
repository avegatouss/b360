;
; B360 Supervisor Configuration
;
; Copy to /etc/supervisor/conf.d/b360.conf
; Then run: sudo supervisorctl reread && sudo supervisorctl update
;

[program:b360-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/b360/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=128
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/b360/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600

[program:b360-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while true; do php /var/www/b360/artisan schedule:run --no-interaction >> /dev/null 2>&1; sleep 60; done"
autostart=true
autorestart=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/b360/storage/logs/scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
