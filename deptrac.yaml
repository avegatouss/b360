## tools/deptrac/deptrac.yaml
## Règles d'architecture B360 — couches autorisées entre modules
## Documentation : docs/architecture/MODULE_DEPENDENCY_MAP.md

deptrac:
  paths:
    - ./Modules
    - ./app

  exclude_files:
    - '#.*Tests.*#'
    - '#.*Database/Migrations/.*#'
    - '#.*Database/Seeders/.*#'
    - '#.*Database/Factories/.*#'

  layers:
    # ═══════════════════════════════════════════════════════════════
    # L0 — Socle (aucune dépendance autorisée vers d'autres modules)
    # ═══════════════════════════════════════════════════════════════
    - name: Core
      collectors:
        - type: directory
          value: Modules/Core/.*

    # ═══════════════════════════════════════════════════════════════
    # L1 — Identité & Configuration
    # ═══════════════════════════════════════════════════════════════
    - name: Auth
      collectors:
        - type: directory
          value: Modules/Auth/.*

    - name: Users
      collectors:
        - type: directory
          value: Modules/Users/.*

    - name: Instances
      collectors:
        - type: directory
          value: Modules/Instances/.*

    - name: Settings
      collectors:
        - type: directory
          value: Modules/Settings/.*

    # ═══════════════════════════════════════════════════════════════
    # L2 — Transverse & Support
    # ═══════════════════════════════════════════════════════════════
    - name: Billing
      collectors:
        - type: directory
          value: Modules/Billing/.*

    - name: Lang
      collectors:
        - type: directory
          value: Modules/Lang/.*

    - name: Currency
      collectors:
        - type: directory
          value: Modules/Currency/.*

    - name: Dashboard
      collectors:
        - type: directory
          value: Modules/Dashboard/.*

    - name: ModuleManager
      collectors:
        - type: directory
          value: Modules/ModuleManager/.*

    - name: Demo
      collectors:
        - type: directory
          value: Modules/Demo/.*

    - name: Installer
      collectors:
        - type: directory
          value: Modules/Installer/.*

    # ═══════════════════════════════════════════════════════════════
    # L3 — Métier (Eshop360 — monolithique en cours de découpage)
    #
    # R-101 S0 : délimitation intra-Eshop360 par sous-domaine.
    # Les fichiers déjà déplacés sous Domain/<X>/ ou Pricing/ sont
    # capturés dans leur sous-layer dédié ; tout le reste reste
    # dans `Eshop360` et sera extrait sous-lot par sous-lot.
    #
    # La ruleset en-dessous est délibérément PERMISSIVE au début
    # (tous les EshopX peuvent dépendre de tous les autres EshopX
    # et du "reste" Eshop360) — le resserrement se fait au fil des
    # sous-lots S1..S11 qui extraient progressivement le code.
    # Voir ADR-008 pour la stratégie.
    # ═══════════════════════════════════════════════════════════════
    - name: EshopCatalog
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Catalog/.*

    - name: EshopCRM
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/CRM/.*

    - name: EshopChannel
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Channel/.*

    - name: EshopPricing
      collectors:
        - type: directory
          value: Modules/Eshop360/Pricing/.*
        - type: directory
          value: Modules/Eshop360/Domain/Pricing/.*

    - name: EshopInventory
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Inventory/.*

    - name: EshopPromotions
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Promotions/.*

    - name: EshopPurchasing
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Purchasing/.*

    - name: EshopSales
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Sales/.*

    - name: EshopFinance
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Finance/.*

    - name: EshopHR
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/HR/.*

    - name: EshopCommunication
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Communication/.*

    - name: EshopProjects
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Projects/.*

    - name: EshopReporting
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Reporting/.*

    # R-101 S12 : EshopShared = infrastructure intra-Eshop360 partagée par
    # plusieurs sous-domaines (traits, scopes, support). Capturée comme un
    # layer distinct pour pouvoir lever proprement la dépendance transitoire
    # `EshopX → Eshop360` sans perdre l'autorisation d'utiliser ces traits.
    # Voir ADR-020 pour la justification.
    - name: EshopShared
      collectors:
        - type: directory
          value: Modules/Eshop360/Database/Traits/.*
        - type: directory
          value: Modules/Eshop360/Database/Scopes/.*
        - type: directory
          value: Modules/Eshop360/Support/.*

    # Eshop360 = "le reste" monolithique non encore extrait.
    # Au fur et à mesure des sous-lots S1..S11, les fichiers migrent
    # vers les layers EshopX ci-dessus et ce layer se vide.
    - name: Eshop360
      collectors:
        - type: bool
          must:
            - type: directory
              value: Modules/Eshop360/.*
          must_not:
            - type: directory
              value: Modules/Eshop360/Domain/.*
            - type: directory
              value: Modules/Eshop360/Pricing/.*
            - type: directory
              value: Modules/Eshop360/Database/Traits/.*
            - type: directory
              value: Modules/Eshop360/Database/Scopes/.*
            - type: directory
              value: Modules/Eshop360/Support/.*

    # ═══════════════════════════════════════════════════════════════
    # Couche app/ (User, Instance — historique)
    # ═══════════════════════════════════════════════════════════════
    - name: AppLayer
      collectors:
        - type: directory
          value: app/.*

  ## ═══════════════════════════════════════════════════════════════
  ## Règles : qui peut dépendre de qui
  ## ═══════════════════════════════════════════════════════════════
  ruleset:
    Core:
      - AppLayer
    Auth:
      - Core
      - AppLayer
    Users:
      - Core
      - Instances
      - AppLayer
    Instances:
      - Core
      - Settings
      - AppLayer
    Settings:
      - Core
      - AppLayer
    Billing:
      - Core
      - Settings
      - Instances
      - Users
      - AppLayer
    Lang:
      - Core
      - Settings
      - AppLayer
    Currency:
      - Core
      - Settings
      - AppLayer
    Dashboard:
      - Core
      - AppLayer
    ModuleManager:
      - Core
      - AppLayer
    Demo:
      - Core
      - Eshop360
      - AppLayer
    Installer:
      - Core
      - Users
      - AppLayer
    # Eshop360 "reste" monolithique — peut dépendre des socles + de
    # tous ses sous-domaines extraits (transition) + EshopShared.
    Eshop360:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - EshopCatalog
      - EshopCRM
      - EshopChannel
      - EshopPricing
      - EshopInventory
      - EshopPromotions
      - EshopPurchasing
      - EshopSales
      - EshopFinance
      - EshopHR
      - EshopCommunication
      - EshopProjects
      - EshopReporting
      - AppLayer

    # R-101 S12 : EshopShared regroupe l'infrastructure partagée intra-Eshop360
    # (traits BelongsToChannel/ScopedByUserAssignment, scopes ChannelScope/
    # OrderUserAssignmentScope/UserAssignmentScope, support CurrentChannel/
    # UiLabel).
    # - Eshop360 : ChannelScope/BelongsToChannel/UserAssignmentScope appellent
    #   `app(ChannelAccessService::class)` / `app(UserResourceScopeService::class)`
    #   au runtime (services dans le layer Eshop360 résiduel).
    # - EshopChannel : BelongsToChannel déclare `belongsTo(DistributionChannel)`.
    #   Crée une dépendance bidirectionnelle EshopShared ↔ EshopChannel,
    #   tolérable car le trait n'instancie pas DistributionChannel — la classe
    #   est seulement référencée comme type de relation.
    EshopShared:
      - Core
      - Auth
      - Users
      - Instances
      - Settings
      - Billing
      - Currency
      - Lang
      - Eshop360
      - EshopChannel
      - AppLayer

    # ═══════════════════════════════════════════════════════════════
    # Sous-domaines Eshop360 — ruleset PERMISSIVE au départ (R-101 S0)
    #
    # Au fur et à mesure des sous-lots, chaque EshopX verra sa liste
    # de dépendances RESTREINTE pour enforcer l'architecture cible :
    #   - Feuilles : EshopCatalog, EshopCRM (pas de dépendance intra)
    #   - EshopChannel, EshopPricing, EshopInventory → EshopCatalog
    #   - EshopPromotions → EshopCatalog, EshopChannel
    #   - EshopPurchasing → EshopCatalog, EshopInventory, EshopFinance
    #   - EshopSales → tous les précédents
    #   - EshopFinance → EshopSales, EshopCRM, EshopPurchasing
    #   - EshopHR → EshopSales
    #   - EshopCommunication → EshopCRM, EshopSales
    #   - EshopProjects → EshopHR, EshopCRM
    #   - EshopReporting → lecture transverse (tous)
    # ═══════════════════════════════════════════════════════════════
    # R-101 S1 : EshopCatalog est désormais RESTREINT.
    # Dépendances autorisées : socles + Eshop360 (transition, pour
    # BelongsToChannel et les alias Stock/OrderItem/Supplier/...).
    # Aucune dépendance vers les autres sous-layers EshopX.
    # Le lien Eshop360 → socles uniquement sera atteint au sous-lot S3
    # (déplacement de BelongsToChannel vers Domain/Channel/).
    EshopCatalog:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - AppLayer
    # R-101 S2 : EshopCRM restreint (feuille, sauf Eshop360 transitoire
    # pour BelongsToChannel, ScopedByUserAssignment et alias cross-domain
    # vers Order/Invoice/OnlineOrder/SupportTicket — levés au fil des sous-lots).
    EshopCRM:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - AppLayer
    # R-101 S3 : EshopChannel restreint (socles + Eshop360 transitoire pour
    # BelongsToChannel/ChannelScope qui restent dans Database/Traits/ —
    # infrastructure partagée intra-Eshop360 selon ADR-011).
    EshopChannel:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - AppLayer
    # R-101 S4 : EshopPricing restreint.
    # Dépendances réelles observées : socles + Product (via alias Eshop360
    # transitoire). Pricing est une FEUILLE logique : aucune dépendance
    # intra-Eshop360 vers les autres sous-domaines (CRM, Channel, Inventory,
    # Sales…). Voir ADR-012.
    # Le sous-domaine Pricing reste physiquement sous `Modules/Eshop360/Pricing/`
    # (non déplacé vers `Domain/Pricing/`) — cohérence du découpage existant.
    EshopPricing:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - EshopCatalog
      - AppLayer
    # R-101 S5 : EshopInventory restreint.
    # Dépendances : socles + EshopCatalog (Product) + Eshop360 transitoire
    # (BelongsToChannel / ScopedByUserAssignment / alias Employee via HR stub).
    # Inventory est un sous-domaine L1 CRITIQUE (stock race — R-001) : les
    # contraintes de concurrence vivent dans les services (StockService avec
    # lockForUpdate), pas dans les modèles — déplacement sans risque runtime.
    EshopInventory:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - EshopCatalog
      - AppLayer
    # R-101 S6 : EshopPromotions restreint.
    # Dépendances réelles : socles + EshopCRM (Customer pour GiftCard) +
    # Eshop360 transitoire (BelongsToChannel + alias Customer via Models/).
    # Promotions ne dépend pas de Catalog directement (les product_ids dans
    # Discount sont des colonnes JSON, pas des relations typées).
    EshopPromotions:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - EshopCRM
      - AppLayer
    # R-101 S7 : EshopPurchasing restreint.
    # Dépendances réelles : socles + EshopCatalog (Product) + EshopInventory
    # (Warehouse) + Eshop360 transitoire (BelongsToChannel + alias Payment,
    # Store via Models/). Suppliers, PurchaseOrders et ImportOrders dépendent
    # de Product + Warehouse ; Payment (Finance) reste en alias transitoire.
    EshopPurchasing:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - EshopCatalog
      - EshopInventory
      - AppLayer
    # R-101 S8 : EshopSales restreint (L1 critique).
    # Dépendances réelles : socles + toutes les feuilles métier consommées par
    # Order / OnlineOrder / SaleReturn / Quotation / CashRegister : Catalog
    # (Product, ProductVariation), CRM (Customer), Channel (ChannelMarginLog),
    # Inventory (Store, Warehouse), + Eshop360 transitoire (Invoice, Payment,
    # Holding, InstallmentPlan, EmployeeCommission, Project via alias — pas
    # encore extraits). Morph stabilisé via `$morphClass` sur les canoniques.
    EshopSales:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - EshopCatalog
      - EshopCRM
      - EshopChannel
      - EshopInventory
      - AppLayer
    # R-101 S9 : EshopFinance restreint (L1 critique).
    # Dépendances : socles + EshopCRM (Customer sur Invoice, InstallmentPlan,
    # RecurringInvoice) + EshopSales (Order sur Invoice, InstallmentPlan) +
    # EshopCatalog (Product sur InvoiceItem) + Eshop360 transitoire (Project,
    # LoanPayment ancienne ref Loan, etc.).
    # Tous les modèles Finance pinnent `$morphClass` sur legacy FQN pour
    # stabilité morph (voir ADR-017).
    EshopFinance:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - EshopCatalog
      - EshopCRM
      - EshopSales
      - AppLayer
    # R-101 S10 : EshopHR restreint.
    # Dépendances : socles + EshopSales (Order via EmployeeCommission) +
    # Eshop360 transitoire (BelongsToChannel).
    EshopHR:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - EshopSales
      - AppLayer
    # R-101 S11 : EshopCommunication restreint.
    # Dépendances : socles + EshopCRM (Customer) + EshopInventory (Store) +
    # Eshop360 transitoire.
    EshopCommunication:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - EshopCRM
      - EshopInventory
      - AppLayer
    # R-101 S11 : EshopProjects restreint.
    # Dépendances : socles + EshopCRM (Customer) + EshopFinance (Invoice) +
    # EshopSales (Order) + Eshop360 transitoire.
    EshopProjects:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - EshopCRM
      - EshopSales
      - EshopFinance
      - AppLayer
    # R-101 S11 : EshopReporting restreint (ApiLog, AuditLog).
    # Dépendances : socles + Eshop360 transitoire uniquement. Le reporting
    # complexe cross-subdomain passe par des services, pas par des imports
    # typés de modèle.
    EshopReporting:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopShared
      - AppLayer

    AppLayer: ~

  ## ═══════════════════════════════════════════════════════════════
  ## Skip : violations existantes tolérées (à résorber progressivement)
  ##
  ## Régénération :
  ##   vendor/bin/deptrac analyse --formatter=baseline --output=tools/deptrac/baseline.tmp.yaml
  ## puis copier-coller le bloc `skip_violations` de tools/deptrac/baseline.tmp.yaml
  ## dans ce fichier (qossmic/deptrac v3 ne supporte plus `baseline:` en config).
  ## ═══════════════════════════════════════════════════════════════
  skip_violations:
    App\Instances\Instance:
      - Modules\Billing\Models\Subscription
      - Modules\Core\Models\License
    App\Models\User:
      - Modules\Eshop360\Models\UserAssignment
    Modules\Core\Http\Controllers\ThemeController:
      - Modules\Settings\Services\SettingsManager
    Modules\Core\Providers\CoreHttpServiceProvider:
      - Modules\Demo\Http\Middleware\DemoGuard
    Modules\Dashboard\Http\Controllers\DashboardController:
      - Modules\Eshop360\Services\EshopSettingsService
    # ─── R-101 S12 baseline ─────────────────────────────────────────────
    # Real cross-subdomain typed relations exposed by S12.3 (consumers
    # rewritten to canonical FQN). Previously hidden because imports went
    # through the Modules\Eshop360\Models\ alias layer, which deptrac
    # classified under Eshop360 (allowed).
    #
    # Two patterns dominate:
    #
    # 1. ChannelAccessService + DistributionChannel : reported on every
    #    model that uses BelongsToChannel. Deptrac follows the trait body
    #    and attributes its deps to the consuming class, not to the trait
    #    itself. This is a deptrac analysis quirk — not a real coupling.
    #    Should auto-resolve if the trait moves to a deeper indirection
    #    (e.g., resolve service through container, never reference
    #    DistributionChannel typed).
    #
    # 2. Genuine domain relations (Customer→Order, Product→Stock, etc.).
    #    These should eventually be tightened by adding the cross-deps
    #    to each EshopX ruleset OR by extracting cross-cutting types into
    #    a shared contract layer. Out of scope for the closure lot.
    Modules\Eshop360\Domain\CRM\Models\Customer:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Domain\Communication\Models\SupportTicket
      - Modules\Eshop360\Domain\Finance\Models\Invoice
      - Modules\Eshop360\Domain\Sales\Models\OnlineOrder
      - Modules\Eshop360\Domain\Sales\Models\Order
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\CRM\Models\CustomerDue:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Domain\Finance\Models\Invoice
      - Modules\Eshop360\Domain\Sales\Models\Order
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\CRM\Models\CustomerGroup:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\CRM\Models\CustomerTransaction:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Catalog\Models\Brand:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Catalog\Models\Category:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Catalog\Models\Product:
      - Modules\Eshop360\Domain\Channel\Models\ChannelProductPrice
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Domain\Inventory\Models\Stock
      - Modules\Eshop360\Domain\Purchasing\Models\Supplier
      - Modules\Eshop360\Domain\Sales\Models\OrderItem
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Catalog\Models\ProductGroup:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Catalog\Models\ProductTax:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Catalog\Models\ProductVariation:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Catalog\Models\Tax:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Channel\Models\ChannelMarginLog:
      - Modules\Eshop360\Domain\Sales\Models\Order
    Modules\Eshop360\Domain\Channel\Models\ChannelProductPrice:
      - Modules\Eshop360\Domain\Catalog\Models\Product
    Modules\Eshop360\Domain\Channel\Models\DistributionChannel:
      - Modules\Eshop360\Domain\CRM\Models\Customer
      - Modules\Eshop360\Domain\Catalog\Models\Product
      - Modules\Eshop360\Domain\Inventory\Models\Warehouse
      - Modules\Eshop360\Domain\Promotions\Models\Coupon
      - Modules\Eshop360\Domain\Sales\Models\CashRegister
      - Modules\Eshop360\Domain\Sales\Models\Holding
      - Modules\Eshop360\Domain\Sales\Models\Order
    Modules\Eshop360\Domain\Communication\Models\BulkMessageLog:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Communication\Models\EmailTemplate:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Communication\Models\Message:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Communication\Models\ReceiptTemplate:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Communication\Models\SmsGateway:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Communication\Models\SmsLog:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Communication\Models\SupportTeam:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Communication\Models\SupportTicket:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Communication\Models\TicketMessage:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Communication\Models\Webhook:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Communication\Models\WebhookLog:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Finance\Models\Account:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Finance\Models\AccountTransaction:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Finance\Models\AccountTransfer:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Finance\Models\ChargeCategory:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Finance\Models\ChargeLog:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Finance\Models\CompanyCharge:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
      - Modules\Eshop360\Services\ChannelAccessService
    Modules\Eshop360\Domain\Finance\Models\EshopPaymentGateway:
      - Modules\Eshop360\Domain\Channel\Models\DistributionChannel
