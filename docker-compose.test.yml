services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: b360_test_system
    ports:
      - "3307:3306"
    command: ["--default-authentication-plugin=mysql_native_password"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespass
      POSTGRES_DB: b360_test_system
    ports:
      - "5433:5432"
