## tools/deptrac/deptrac.yaml
## Règles d'architecture B360 — couches autorisées entre modules
## Documentation : docs/architecture/MODULE_DEPENDENCY_MAP.md

deptrac:
  paths:
    - ./Modules
    - ./app

  exclude_files:
    - '#.*Tests.*#'
    - '#.*Database/Migrations/.*#'
    - '#.*Database/Seeders/.*#'
    - '#.*Database/Factories/.*#'

  layers:
    # ═══════════════════════════════════════════════════════════════
    # L0 — Socle (aucune dépendance autorisée vers d'autres modules)
    # ═══════════════════════════════════════════════════════════════
    - name: Core
      collectors:
        - type: directory
          value: Modules/Core/.*

    # ═══════════════════════════════════════════════════════════════
    # L1 — Identité & Configuration
    # ═══════════════════════════════════════════════════════════════
    - name: Auth
      collectors:
        - type: directory
          value: Modules/Auth/.*

    - name: Users
      collectors:
        - type: directory
          value: Modules/Users/.*

    - name: Instances
      collectors:
        - type: directory
          value: Modules/Instances/.*

    - name: Settings
      collectors:
        - type: directory
          value: Modules/Settings/.*

    # ═══════════════════════════════════════════════════════════════
    # L2 — Transverse & Support
    # ═══════════════════════════════════════════════════════════════
    - name: Billing
      collectors:
        - type: directory
          value: Modules/Billing/.*

    - name: Lang
      collectors:
        - type: directory
          value: Modules/Lang/.*

    - name: Currency
      collectors:
        - type: directory
          value: Modules/Currency/.*

    - name: Dashboard
      collectors:
        - type: directory
          value: Modules/Dashboard/.*

    - name: ModuleManager
      collectors:
        - type: directory
          value: Modules/ModuleManager/.*

    - name: Demo
      collectors:
        - type: directory
          value: Modules/Demo/.*

    - name: Installer
      collectors:
        - type: directory
          value: Modules/Installer/.*

    # ═══════════════════════════════════════════════════════════════
    # L3 — Métier (Eshop360 — monolithique en cours de découpage)
    #
    # R-101 S0 : délimitation intra-Eshop360 par sous-domaine.
    # Les fichiers déjà déplacés sous Domain/<X>/ ou Pricing/ sont
    # capturés dans leur sous-layer dédié ; tout le reste reste
    # dans `Eshop360` et sera extrait sous-lot par sous-lot.
    #
    # La ruleset en-dessous est délibérément PERMISSIVE au début
    # (tous les EshopX peuvent dépendre de tous les autres EshopX
    # et du "reste" Eshop360) — le resserrement se fait au fil des
    # sous-lots S1..S11 qui extraient progressivement le code.
    # Voir ADR-008 pour la stratégie.
    # ═══════════════════════════════════════════════════════════════
    - name: EshopCatalog
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Catalog/.*

    - name: EshopCRM
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/CRM/.*

    - name: EshopChannel
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Channel/.*

    - name: EshopPricing
      collectors:
        - type: directory
          value: Modules/Eshop360/Pricing/.*
        - type: directory
          value: Modules/Eshop360/Domain/Pricing/.*

    - name: EshopInventory
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Inventory/.*

    - name: EshopPromotions
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Promotions/.*

    - name: EshopPurchasing
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Purchasing/.*

    - name: EshopSales
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Sales/.*

    - name: EshopFinance
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Finance/.*

    - name: EshopHR
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/HR/.*

    - name: EshopCommunication
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Communication/.*

    - name: EshopProjects
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Projects/.*

    - name: EshopReporting
      collectors:
        - type: directory
          value: Modules/Eshop360/Domain/Reporting/.*

    # Eshop360 = "le reste" monolithique non encore extrait.
    # Au fur et à mesure des sous-lots S1..S11, les fichiers migrent
    # vers les layers EshopX ci-dessus et ce layer se vide.
    - name: Eshop360
      collectors:
        - type: bool
          must:
            - type: directory
              value: Modules/Eshop360/.*
          must_not:
            - type: directory
              value: Modules/Eshop360/Domain/.*
            - type: directory
              value: Modules/Eshop360/Pricing/.*

    # ═══════════════════════════════════════════════════════════════
    # Couche app/ (User, Instance — historique)
    # ═══════════════════════════════════════════════════════════════
    - name: AppLayer
      collectors:
        - type: directory
          value: app/.*

  ## ═══════════════════════════════════════════════════════════════
  ## Règles : qui peut dépendre de qui
  ## ═══════════════════════════════════════════════════════════════
  ruleset:
    Core:
      - AppLayer
    Auth:
      - Core
      - AppLayer
    Users:
      - Core
      - Instances
      - AppLayer
    Instances:
      - Core
      - Settings
      - AppLayer
    Settings:
      - Core
      - AppLayer
    Billing:
      - Core
      - Settings
      - Instances
      - Users
      - AppLayer
    Lang:
      - Core
      - Settings
      - AppLayer
    Currency:
      - Core
      - Settings
      - AppLayer
    Dashboard:
      - Core
      - AppLayer
    ModuleManager:
      - Core
      - AppLayer
    Demo:
      - Core
      - Eshop360
      - AppLayer
    Installer:
      - Core
      - Users
      - AppLayer
    # Eshop360 "reste" monolithique — peut dépendre des socles + de
    # tous ses sous-domaines extraits (transition).
    Eshop360:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - EshopCatalog
      - EshopCRM
      - EshopChannel
      - EshopPricing
      - EshopInventory
      - EshopPromotions
      - EshopPurchasing
      - EshopSales
      - EshopFinance
      - EshopHR
      - EshopCommunication
      - EshopProjects
      - EshopReporting
      - AppLayer

    # ═══════════════════════════════════════════════════════════════
    # Sous-domaines Eshop360 — ruleset PERMISSIVE au départ (R-101 S0)
    #
    # Au fur et à mesure des sous-lots, chaque EshopX verra sa liste
    # de dépendances RESTREINTE pour enforcer l'architecture cible :
    #   - Feuilles : EshopCatalog, EshopCRM (pas de dépendance intra)
    #   - EshopChannel, EshopPricing, EshopInventory → EshopCatalog
    #   - EshopPromotions → EshopCatalog, EshopChannel
    #   - EshopPurchasing → EshopCatalog, EshopInventory, EshopFinance
    #   - EshopSales → tous les précédents
    #   - EshopFinance → EshopSales, EshopCRM, EshopPurchasing
    #   - EshopHR → EshopSales
    #   - EshopCommunication → EshopCRM, EshopSales
    #   - EshopProjects → EshopHR, EshopCRM
    #   - EshopReporting → lecture transverse (tous)
    # ═══════════════════════════════════════════════════════════════
    # R-101 S1 : EshopCatalog est désormais RESTREINT.
    # Dépendances autorisées : socles + Eshop360 (transition, pour
    # BelongsToChannel et les alias Stock/OrderItem/Supplier/...).
    # Aucune dépendance vers les autres sous-layers EshopX.
    # Le lien Eshop360 → socles uniquement sera atteint au sous-lot S3
    # (déplacement de BelongsToChannel vers Domain/Channel/).
    EshopCatalog:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - Eshop360
      - AppLayer
    # R-101 S2 : EshopCRM restreint (feuille, sauf Eshop360 transitoire
    # pour BelongsToChannel, ScopedByUserAssignment et alias cross-domain
    # vers Order/Invoice/OnlineOrder/SupportTicket — levés au fil des sous-lots).
    EshopCRM:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - Eshop360
      - AppLayer
    # R-101 S3 : EshopChannel restreint (socles + Eshop360 transitoire pour
    # BelongsToChannel/ChannelScope qui restent dans Database/Traits/ —
    # infrastructure partagée intra-Eshop360 selon ADR-011).
    EshopChannel:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - Eshop360
      - AppLayer
    # R-101 S4 : EshopPricing restreint.
    # Dépendances réelles observées : socles + Product (via alias Eshop360
    # transitoire). Pricing est une FEUILLE logique : aucune dépendance
    # intra-Eshop360 vers les autres sous-domaines (CRM, Channel, Inventory,
    # Sales…). Voir ADR-012.
    # Le sous-domaine Pricing reste physiquement sous `Modules/Eshop360/Pricing/`
    # (non déplacé vers `Domain/Pricing/`) — cohérence du découpage existant.
    EshopPricing:
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - Eshop360
      - EshopCatalog
      - AppLayer
    EshopInventory: &eshop_sublayer_base
      - Core
      - Auth
      - Users
      - Settings
      - Billing
      - Currency
      - Lang
      - Eshop360
      - EshopCatalog
      - EshopCRM
      - EshopChannel
      - EshopPricing
      - EshopInventory
      - EshopPromotions
      - EshopPurchasing
      - EshopSales
      - EshopFinance
      - EshopHR
      - EshopCommunication
      - EshopProjects
      - EshopReporting
      - AppLayer
    EshopPromotions: *eshop_sublayer_base
    EshopPurchasing: *eshop_sublayer_base
    EshopSales: *eshop_sublayer_base
    EshopFinance: *eshop_sublayer_base
    EshopHR: *eshop_sublayer_base
    EshopCommunication: *eshop_sublayer_base
    EshopProjects: *eshop_sublayer_base
    EshopReporting: *eshop_sublayer_base

    AppLayer: ~

  ## ═══════════════════════════════════════════════════════════════
  ## Skip : violations existantes tolérées (à résorber progressivement)
  ##
  ## Régénération :
  ##   vendor/bin/deptrac analyse --formatter=baseline --output=tools/deptrac/baseline.tmp.yaml
  ## puis copier-coller le bloc `skip_violations` de tools/deptrac/baseline.tmp.yaml
  ## dans ce fichier (qossmic/deptrac v3 ne supporte plus `baseline:` en config).
  ## ═══════════════════════════════════════════════════════════════
  skip_violations:
    App\Instances\Instance:
      - Modules\Billing\Models\Subscription
      - Modules\Core\Models\License
    App\Models\User:
      - Modules\Eshop360\Models\UserAssignment
    Modules\Core\Http\Controllers\ThemeController:
      - Modules\Settings\Services\SettingsManager
    Modules\Core\Providers\CoreHttpServiceProvider:
      - Modules\Demo\Http\Middleware\DemoGuard
    Modules\Dashboard\Http\Controllers\DashboardController:
      - Modules\Eshop360\Services\EshopSettingsService
    Modules\ModuleManager\Http\Controllers\ModuleController:
      - Modules\Eshop360\Services\EshopInitializer
    currency():
      - Modules\Currency\Services\CurrencyManager
    format_currency():
      - Modules\Currency\Services\CurrencyManager

  formatters:
    graphviz:
      hidden_layers:
        - AppLayer
      groups:
        L0:
          - Core
        L1:
          - Auth
          - Users
          - Instances
          - Settings
        L2:
          - Billing
          - Lang
          - Currency
          - Dashboard
          - ModuleManager
          - Demo
          - Installer
        L3:
          - Eshop360
          - EshopCatalog
          - EshopCRM
          - EshopChannel
          - EshopPricing
          - EshopInventory
          - EshopPromotions
          - EshopPurchasing
          - EshopSales
          - EshopFinance
          - EshopHR
          - EshopCommunication
          - EshopProjects
          - EshopReporting
